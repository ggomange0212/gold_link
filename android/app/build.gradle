plugins {
    id 'com.android.application'
}

// GitHub Actions 가 비밀 저장소(Secrets)의 서명 키를 넣어 줌
def signingKeystore = System.getenv("SIGNING_KEYSTORE")
def signingPassword = System.getenv("SIGNING_PASSWORD")
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.mumulink.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mumulink.app'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.${runNumber}"
    }

    signingConfigs {
        fixed {
            if (signingKeystore) {
                storeFile file(signingKeystore)
                storePassword signingPassword
                keyAlias 'mumulink'
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        debug {
            if (signingKeystore) {
                signingConfig signingConfigs.fixed      // 항상 같은 키 -> 지우지 않고 업데이트 설치 가능
            }
        }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
