name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "::error::서명 키가 없어요. Settings > Secrets and variables > Actions 에 SIGNING_KEYSTORE_B64, SIGNING_PASSWORD 를 넣어 주세요."
            exit 1
          fi
          echo "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/mumulink.p12"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/mumulink.p12" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MuMuLink.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MuMuLink-apk
          path: MuMuLink.apk

      - name: Publish release (phone download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 뮤뮤 링크 앱 ${{ github.run_number }}
          files: MuMuLink.apk
          make_latest: true
